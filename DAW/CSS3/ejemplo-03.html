<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector de ID | Ejemplo 03</title>
  <style>
    #titulo { color: navy; } /* Selecciona el unico elemento con id titulo. establece el color del texto. */
  </style>
</head>
<body>
  <!-- Un ID identifica una sección única de la página. -->
  <h1 id="titulo">Mi portafolio</h1>
</body>
</html>
