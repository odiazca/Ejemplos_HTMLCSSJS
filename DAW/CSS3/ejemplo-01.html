<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector de etiqueta | Ejemplo 01</title>
  <style>
    body { font-family: Arial, sans-serif; } /* Selecciona el cuerpo de la pagina. elige Arial y una fuente generica alternativa. */
    p { color: #334155; } /* Selecciona todos los parrafos. establece el color del texto. */
  </style>
</head>
<body>
  <!-- El selector de etiqueta aplica un estilo a todos esos elementos. -->
  <h1>Noticias del campus</h1><p>Este párrafo comparte estilo.</p>
</body>
</html>
