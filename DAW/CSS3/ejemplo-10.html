<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imagen de fondo | Ejemplo 10</title>
  <style>
    .portada { padding: 24px; color: white; background-image: linear-gradient(90deg,#0369a1,#7c3aed); } /* Selecciona la portada. anade espacio interior entre contenido y borde. establece el color del texto. aplica un degradado como imagen de fondo. */

</head>
<body>
  <!-- Un degradado también es una imagen de fondo CSS. -->
  <header class="portada"><h1>Semana de proyectos</h1></header>
</body>
