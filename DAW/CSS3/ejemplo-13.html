<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Posición absolute | Ejemplo 13</title>
  <style>
    .marco { position: relative; padding: 30px; background: #e2e8f0; } /* Selecciona el contenedor de referencia. elige el modo de posicionamiento. anade espacio interior entre contenido y borde. establece el color de fondo. */
    .insignia { position: absolute; top: 4px; right: 4px; } /* Selecciona la insignia posicionada. elige el modo de posicionamiento. ajusta la distancia desde el borde superior. ajusta la distancia desde el borde derecho. */
  </style>
</head>
<body>
  <!-- El padre relative define el marco de absolute. -->
  <div class="marco">Proyecto<span class="insignia">NUEVO</span></div>
</body>
</html>
