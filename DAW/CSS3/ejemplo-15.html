<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Posición sticky | Ejemplo 15</title>
  <style>
    .menu { position: sticky; top: 0; padding: 12px; background: #fde68a; } /* Selecciona el menu que se pega al desplazarse. elige el modo de posicionamiento. ajusta la distancia desde el borde superior. anade espacio interior entre contenido y borde. establece el color de fondo. */
    .relleno { height: 900px; } /* Selecciona el bloque que permite desplazarse. define la altura del bloque. */
  </style>
</head>
<body>
  <!-- sticky se pega al borde al llegar a la posición indicada. -->
  <nav class="menu">Inicio · Cursos · Contacto</nav><div class="relleno">Desplázate</div>
</body>
</html>
