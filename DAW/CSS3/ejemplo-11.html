<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuente web | Ejemplo 11</title>
  <!-- Prepara la conexion para cargar la fuente web. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .titulo { font-family: "Roboto", sans-serif; } /* Selecciona el titulo con fuente web. usa Roboto y una fuente sans-serif alternativa. */
  </style>
</head>
<body>
  <!-- Google Fonts carga una tipografía web y requiere conexión. -->
  <h1 class="titulo">Aprende diseño web</h1>
</body>
</html>
