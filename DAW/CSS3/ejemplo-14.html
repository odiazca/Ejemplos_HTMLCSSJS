<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Posición fixed | Ejemplo 14</title>
  <style>
    .ayuda { position: fixed; right: 16px; bottom: 16px; } /* Selecciona el boton fijo de ayuda. elige el modo de posicionamiento. ajusta la distancia desde el borde derecho. ajusta la distancia desde el borde inferior. */
    .relleno { height: 900px; } /* Selecciona el bloque que permite desplazarse. define la altura del bloque. */
  </style>
</head>
<body>
  <!-- fixed permanece en la ventana al desplazarse. -->
  <p>Desplázate para ver el botón.</p><button class="ayuda">Ayuda</button><div class="relleno"></div>
</body>
</html>
