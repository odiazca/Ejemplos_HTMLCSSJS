<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display inline-block y none | Ejemplo 17</title>
  <style>
    .etiqueta { display: inline-block; padding: 8px; background: #ddd6fe; } /* Selecciona la etiqueta desplazable. define como participa el elemento en el diseno. anade espacio interior entre contenido y borde. establece el color de fondo. */
    .oculto { display: none; } /* Selecciona el elemento que se oculta. define como participa el elemento en el diseno. */
  </style>
</head>
<body>
  <!-- inline-block admite dimensiones; none oculta el elemento. -->
  <span class="etiqueta">HTML</span><span class="etiqueta">CSS</span><p class="oculto">No se muestra</p>
</body>
</html>
