<html lang="es">
<head>

  <title>Color HEX | Ejemplo 07</title>
  <style>
    .hex { color: #ffffff; background: #2563eb; padding: 10px; } /* Selecciona el texto de color HEX. establece el color del texto. establece el color de fondo. anade espacio interior entre contenido y borde. */

</head>
<body>
  <!-- HEX es una forma común de escribir colores. -->
