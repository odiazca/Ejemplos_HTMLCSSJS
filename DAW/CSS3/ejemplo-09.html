<head>

  <title>Color HSL | Ejemplo 09</title>
  <style>
    .hsl { color: hsl(145,70%,25%); background: hsl(145,60%,90%); } /* Selecciona el boton de color HSL. establece el color del texto. establece el color de fondo. */

  <!-- HSL define tono, saturación y luminosidad. -->
