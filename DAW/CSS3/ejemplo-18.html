<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox básico | Ejemplo 18</title>
  <style>
    .fila { display: flex; flex-direction: row; justify-content: space-around; align-items: center; height: 100px; background: #f1f5f9; } /* Selecciona el contenedor flexible. define como participa el elemento en el diseno. orienta los elementos flexibles en una fila. distribuye los elementos a lo largo del eje principal. alinea los elementos en el eje transversal. define la altura del bloque. establece el color de fondo. */
  </style>
</head>
<body>
  <!-- Flexbox alinea elementos en una fila. -->
  <div class="fila"><span>HTML</span><span>CSS</span><span>JS</span></div>
</body>
</html>
