<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display inline y block | Ejemplo 16</title>
  <style>
    .en-linea { display: inline; background: #bfdbfe; } /* Selecciona elementos que se muestran en linea. define como participa el elemento en el diseno. establece el color de fondo. */
    .bloque { display: block; background: #bbf7d0; } /* Selecciona el parrafo que se muestra como bloque. define como participa el elemento en el diseno. establece el color de fondo. */
  </style>
</head>
<body>
  <!-- inline sigue en la línea; block ocupa el ancho disponible. -->
  <span class="en-linea">HTML</span><span class="en-linea">CSS</span><p class="bloque">JavaScript</p>
</body>
</html>
