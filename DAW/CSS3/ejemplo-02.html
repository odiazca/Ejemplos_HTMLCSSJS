<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector de clase | Ejemplo 02</title>
  <style>
    .aviso { background: #fff3cd; padding: 12px; } /* Selecciona los elementos reutilizables con clase aviso. establece el color de fondo. anade espacio interior entre contenido y borde. */
  </style>
</head>
<body>
  <!-- Una clase reutilizable se escribe con punto en CSS. -->
  <p class="aviso">Trae tu computadora al laboratorio.</p>
</body>
</html>
