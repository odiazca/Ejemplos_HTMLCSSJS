<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artículo y contenido relacionado | Ejemplo 17</title>
</head>
<body>
  <!-- article es independiente; aside contiene información complementaria. -->
  <main><article><h1>Proyecto</h1><p>Crearemos una página accesible.</p></article> <!-- Explicacion: main contiene el contenido principal y article agrupa una publicacion independiente. -->
  <aside>Recurso: guía de HTML.</aside></main> <!-- Explicacion: aside presenta un recurso complementario y cierra el contenido principal. -->
</body>
</html>
