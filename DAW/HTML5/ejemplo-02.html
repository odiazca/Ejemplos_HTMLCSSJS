<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encabezados y párrafos | Ejemplo 02</title>
</head>
<body>
  <!-- Usa encabezados para jerarquizar el contenido. -->
  <h1>Guía del estudiante</h1> <!-- Explicacion: El encabezado principal indica el tema. -->
  <h2>Desarrollo Web</h2> <!-- Explicacion: El subtitulo presenta el area de estudio. -->
  <p>Aprenderemos paso a paso.</p> <!-- Explicacion: El parrafo resume el contenido. -->
</body>
</html>
