<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabla semántica | Ejemplo 10</title>
</head>
<body>
  <!-- caption, thead y tbody dan estructura a los datos. -->
  <table> <!-- Explicacion: Abre la tabla semantica del horario. -->
  <caption>Horario</caption><thead><tr><th scope="col">Día</th><th scope="col">Clase</th></tr></thead> <!-- Explicacion: caption titula la tabla y thead agrupa encabezados con scope de columna. -->
  <tbody><tr><td>Lunes</td><td>HTML</td></tr></tbody> <!-- Explicacion: tbody agrupa los datos del horario. -->
  </table> <!-- Explicacion: Cierra la tabla. -->
</body>
</html>
