<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista ordenada | Ejemplo 07</title>
</head>
<body>
  <!-- ol sirve para una secuencia de pasos. -->
  <h1>Publicar una página</h1> <!-- Explicacion: El encabezado indica el objetivo de los pasos. -->
  <ol><li>Escribir HTML</li><li>Guardar</li><li>Abrir en el navegador</li></ol> <!-- Explicacion: ol ordena las acciones que se realizan en secuencia. -->
</body>
</html>
