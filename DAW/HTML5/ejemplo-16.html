<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landmarks semánticos | Ejemplo 16</title>
</head>
<body>
  <!-- Los landmarks identifican las zonas principales. -->
  <header><h1>Portal del curso</h1></header> <!-- Explicacion: header contiene la cabecera de la pagina. -->
  <nav><a href="#contenido">Ir al contenido</a></nav> <!-- Explicacion: nav contiene un enlace de navegacion hacia el contenido. -->
  <main id="contenido"><section><h2>Novedades</h2><p>Bienvenidos.</p></section></main> <!-- Explicacion: main identifica el contenido principal y section agrupa novedades. -->
  <footer>ITSE · Desarrollo Web</footer> <!-- Explicacion: footer presenta el pie de pagina institucional. -->
</body>
</html>
