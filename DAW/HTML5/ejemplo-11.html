<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de correo | Ejemplo 11</title>
</head>
<body>
  <!-- type=email valida el formato en el navegador. -->
  <form><label for="correo">Correo:</label> <!-- Explicacion: Abre el formulario y asocia la etiqueta con el campo de correo. -->
  <input id="correo" name="correo" type="email" required> <!-- Explicacion: El campo email valida el formato y required lo hace obligatorio. -->
  <button type="submit">Enviar</button></form> <!-- Explicacion: Envia el formulario al activarse el boton. -->
</body>
</html>
