<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista desordenada | Ejemplo 06</title>
</head>
<body>
  <!-- ul representa elementos cuyo orden no importa. -->
  <h1>Materiales</h1> <!-- Explicacion: El encabezado presenta la lista. -->
  <ul><li>Cuaderno</li><li>Lápiz</li><li>Computadora</li></ul> <!-- Explicacion: ul agrupa materiales y cada li representa un elemento. -->
</body>
</html>
