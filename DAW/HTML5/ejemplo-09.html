<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabla básica | Ejemplo 09</title>
</head>
<body>
  <!-- Las filas agrupan celdas relacionadas. -->
  <table> <!-- Explicacion: Abre la tabla que contiene los datos. -->
  <tr><th>Curso</th><th>Aula</th></tr> <!-- Explicacion: Crea una fila con los encabezados de las columnas. -->
  <tr><td>HTML</td><td>Lab 1</td></tr> <!-- Explicacion: Crea una fila con los valores del curso. -->
  </table> <!-- Explicacion: Cierra la tabla. -->
</body>
