<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estructura mínima | Ejemplo 01</title>
</head>
<body>
  <!-- El doctype indica al navegador que este documento usa HTML5. -->

</body>
</html>
