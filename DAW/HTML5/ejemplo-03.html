<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formato semántico | Ejemplo 03</title>
</head>
<body>
  <!-- El marcado expresa importancia, énfasis y resaltado. -->
  <p><strong>Importante:</strong> entrega el proyecto <em>hoy</em>.</p> <!-- Explicacion: strong marca el aviso importante y em resalta el enfasis. -->
  <p>Próxima clase: <mark>HTML semántico</mark>.</p> <!-- Explicacion: mark destaca visualmente el proximo tema. -->
</body>
</html>
