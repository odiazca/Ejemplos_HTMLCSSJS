<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operadores | Ejemplo 03</title>
  <script type="module">
    const precio = 12; // Define el precio unitario.
    const cantidad = 3; // Define la cantidad comprada.
    console.log("Total:", precio * cantidad); // Multiplica precio por cantidad y muestra el total.
    console.log(precio * cantidad > 20); // Compara el total con 20 y muestra true o false.
  </script>
</head>
<body>
  <!-- Combina operaciones aritméticas y comparaciones. -->
  <p>El resultado aparece en la consola.</p>
</body>
</html>
