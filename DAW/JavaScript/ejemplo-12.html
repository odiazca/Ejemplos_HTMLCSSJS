<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>querySelector | Ejemplo 12</title>
  <script type="module">
    const aviso = document.querySelector(".aviso"); // Selecciona el primer elemento con clase aviso.
    console.log(aviso.innerText); // Imprime el contenido del aviso.
  </script>
</head>
<body>
  <!-- querySelector acepta selectores CSS. -->
  <p class="aviso">Próxima entrega: viernes</p>
</body>
</html>
