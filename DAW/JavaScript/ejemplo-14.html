<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar innerHTML | Ejemplo 14</title>
  <script type="module">
    document.getElementById("tarjeta").innerHTML = "<strong>Curso1111:</strong> HTML5"; // Inserta contenido con marcado strong para resaltar el curso.
  </script>
</head>
<body>
  <!-- innerHTML inserta marcado HTML sencillo y confiable. -->
  <div id="tarjeta"></div>
</body>
</html>
