<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>let, const y console.log | Ejemplo 01</title>
  <script type="module">
    const curso = "Desarrollo Web"; // Guarda el nombre del curso en una constante.
    let semana = 1; // Crea una variable cuyo valor puede cambiar.
    console.log(curso, semana); // Muestra ambos valores en la consola.
  </script>
</head>
<body>
  <!-- Usa const si el valor no se reasigna y let si cambiará. -->
  <p>Abre las herramientas del navegador y revisa la consola.</p>
</body>
</html>
