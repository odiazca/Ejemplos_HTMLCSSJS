<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tipos de datos | Ejemplo 02</title>
  <script type="module">
    const estudiante = "Ana"; // Guarda un texto con el nombre del estudiante.
    const nota = 92; // Guarda una calificacion numerica.
    const aprobado = true; // Guarda un valor booleano verdadero.
    console.log(typeof estudiante, typeof nota, aprobado); // Muestra los tipos y el valor en la consola.
  </script>
</head>
<body>
  <!-- Los valores pueden ser texto, número o booleano. -->
  <p>Observa los tipos en la consola.</p>
</body>
</html>
