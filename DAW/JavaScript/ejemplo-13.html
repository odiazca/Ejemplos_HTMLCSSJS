<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar innerText | Ejemplo 13</title>
  <script type="module">
    document.getElementById("mensaje").innerText = "Bienvenidos al laboratorioaaaa"; // Actualiza el texto del elemento seleccionado.
  </script>
</head>
<body>
  <!-- innerText actualiza texto sin interpretar etiquetas. -->
  <p id="mensaje"></p>
</body>
</html>
