<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arrow function | Ejemplo 10</title>
  <script type="module">
    const duplicar = numero => numero * 2; // Define una funcion flecha que devuelve el doble.
    document.getElementById("doble").innerText = duplicar(21); // Calcula el doble de 21 y lo muestra.
  </script>
</head>
<body>
  <!-- Una arrow function es una sintaxis breve. -->
  <p id="doble"></p>
</body>
</html>
