<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>getElementById | Ejemplo 11</title>
  <script type="module">
    const estado = document.getElementById("estado"); // Selecciona el parrafo identificado como estado.
    console.log(estado.innerText); // Muestra en la consola el texto seleccionado.
  </script>
</head>
<body>
  <!-- Selecciona un elemento por su identificador único. -->
  <p id="estado">Pendiente</p>
</body>
</html>
